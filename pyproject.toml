[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-safety-rag"
version = "0.1.0"
description = "Assistant RAG sur la réglementation sécurité incendie et sécurité privée, avec sources citées."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hissein Haggar SENOUSSI" }]
requires-python = ">=3.11"
dependencies = [
    # SDK officiel Anthropic (appel au LLM). 2.3 (2026-10-23) plutôt que les
    # versions suivantes, publiées il y a moins de deux semaines.
    "anthropic>=2.3,<2.4",
    # API HTTP. Version exacte : en 0.x, une version mineure peut casser l'API ;
    # 0.162.0 (2026-10-23) plutôt que 0.162.1+, publiées il y a moins de deux semaines.
    "fastapi==0.162.0",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3,<3.4",
    "pydantic-settings>=2.0",
    "pypdf>=5.0",
    # Serveur de l'API (0.54.0 publiée le 2026-09-25).
    "uvicorn>=0.54,<0.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Client HTTP du TestClient de FastAPI (tests de l'API). Absent sinon de la CI :
    # anthropic utilise httpx2, et httpx ne vient qu'avec l'extra "embeddings".
    "httpx>=0.28,<0.29",
]
# Calcul local des embeddings (installe PyTorch, lourd) : volontairement séparé
# des dépendances principales pour que la CI reste légère.
# 6.1 plutôt que 6.2, publiée le 2026-10-21 et encore trop récente.
embeddings = [
    "sentence-transformers>=6.1,<6.2",
]
# Interface web (lourde : pandas, pyarrow…), inutile à l'API et à la CI.
# 1.66.1 (2026-10-21) plutôt que 1.67.0, publiée le 2026-11-05.
ui = [
    "streamlit>=1.66.1,<1.67",
    "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "app"]
plugins = ["pydantic.mypy"]

# sentence-transformers et streamlit sont optionnels (extras) et absents de la CI :
# sans cette règle, mypy y échouerait sur "module introuvable".
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true