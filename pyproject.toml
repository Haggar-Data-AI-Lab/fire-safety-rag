[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-safety-rag"
version = "0.1.0"
description = "Assistant RAG sur la réglementation sécurité incendie et sécurité privée, avec sources citées."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hissein Haggar SENOUSSI" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Calcul local des embeddings (installe PyTorch, lourd) : volontairement séparé
# des dépendances principales pour que la CI reste légère.
# 6.1 plutôt que 6.2, publiée le 2026-10-21 et encore trop récente.
embeddings = [
    "sentence-transformers>=6.1,<6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]